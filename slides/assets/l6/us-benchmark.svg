<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="mfff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker><marker id="mffcf5a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffcf5a"/></marker><marker id="m8fc59a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fc59a"/></marker><marker id="mef8a6f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef8a6f"/></marker><marker id="m8a8a8a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker><marker id="m8ab4f8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8ab4f8"/></marker></defs><text x="60" y="50" fill="#ef8a6f" text-anchor="start" font-size="34" font-weight="700">China 1998: equal TFPR everywhere</text><rect x="60" y="72" width="644.6" height="64" rx="6" fill="#ef8a6f" fill-opacity="0.85"/><text x="721" y="118" fill="#ef8a6f" text-anchor="start" font-size="36" font-weight="700">+115%</text><text x="60" y="196" fill="#ffcf5a" text-anchor="start" font-size="34" font-weight="700">India 1994: equal TFPR everywhere</text><rect x="60" y="218" width="714.0" height="64" rx="6" fill="#ffcf5a" fill-opacity="0.85"/><text x="790" y="264" fill="#ffcf5a" text-anchor="start" font-size="36" font-weight="700">+128%</text><text x="60" y="342" fill="#fff" text-anchor="start" font-size="34" font-weight="700">US 1997: equal TFPR everywhere</text><rect x="60" y="364" width="240.2" height="64" rx="6" fill="#fff" fill-opacity="0.85"/><text x="316" y="410" fill="#fff" text-anchor="start" font-size="36" font-weight="700">+43%</text><text x="60" y="520" fill="#fff" text-anchor="start" font-size="30" font-weight="400" opacity="0.85">Even the US would gain: some dispersion is normal</text><text x="60" y="560" fill="#fff" text-anchor="start" font-size="30" font-weight="400" opacity="0.85">(adjustment costs, errors in the data)</text><text x="60" y="646" fill="#8fc59a" text-anchor="start" font-size="34" font-weight="700">Up to US efficiency:</text><text x="60" y="704" fill="#8fc59a" text-anchor="start" font-size="38" font-weight="700">China 1998: 2.15 ÷ 1.43 = 1.50, so +50%</text><text x="60" y="762" fill="#8fc59a" text-anchor="start" font-size="38" font-weight="700">India 1994: 2.28 ÷ 1.43 = 1.59, so +59%</text></svg>